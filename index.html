<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.fluid.classless.min.css">
    <title>Vue JS User List Example</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        main {
            margin: auto;
            padding: 1rem;
        }
        .sorted-asc::after {
            content: ' ↑';
        }
        .sorted-desc::after {
            content: ' ↓';
        }
        .table-message td {
            text-align: center;
            padding: 1rem;
            color: var(--muted-color);
        }
    </style>
</head>
<body>
    <div id="app">
        <main>
            <div>
                <h1>Vue JS User List Example</h1>
                <hr>
                <div style="display: flex; gap: 0.5rem; align-items: center; vertical-align: middle; margin-bottom: 1rem;">
                    <button @click="fetchUsersMethod" :aria-busy="isLoading" style="flex: 1; margin: 0px;">
                        {{ isLoading ? 'Fetching...' : 'Fetch Users' }}
                    </button>
                    <div style="display: flex; flex-direction: column; margin: 0px 40px; flex: 1;">
                        <label for="search-users-input">Search users</label>
                        <input type="text" id="search-users-input" v-model="currentSearchTerm"
                            placeholder="Type name or first name" aria-label="Search users" autocomplete="off">
                    </div>
                    <div style="display: flex; flex-direction: column; flex: 1;">
                        <label for="filter-users-by-gender">Filter by gender</label>
                        <select id="filter-users-by-gender" v-model="currentGenderFilter">
                            <option value="" selected>All</option>
                            <option value="male">👨 Male</option>
                            <option value="female">👩 Female</option>
                        </select>
                    </div>
                </div>
            </div>
            <h6 id="users-displayed">{{ usersToDisplayCountText }}</h6>
            <figure>
                <table id="tbl-users" role="grid">
                    <thead>
                        <tr>
                            <th style="width: 60px; min-width: 60px;">Photo</th>
                            <th style="width: 180px; min-width: 120px;">Name</th>
                            <th style="width: 90px; min-width: 80px;">Gender</th>
                            <th style="width: 240px; min-width: 180px;">Email</th>
                            <th style="width: 160px; min-width: 120px;">Phone</th>
                            <th data-sort="dob.age" style="width: 80px; min-width: 60px; cursor: pointer;"
                                @click="handleSort('dob.age')" :class="getSortColumnClasses('dob.age')"
                                :aria-sort="getAriaSortDirection('dob.age')">
                                {{ getColumnHeaderText('dob.age', 'Age') }}
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-if="isLoading" class="table-message">
                            <td colspan="6">Loading users...</td>
                        </tr>
                        <tr v-else-if="!filteredAndSortedUsers.length && pristineFetchedUsers.length && !isLoading"
                            class="table-message">
                            <td colspan="6">No users match your current criteria.</td>
                        </tr>
                        <tr v-else-if="!pristineFetchedUsers.length && !isLoading" class="table-message">
                            <td colspan="6">No users fetched yet. Click "Fetch Users" to start.</td>
                        </tr>
                        <tr v-else v-for="user in filteredAndSortedUsers" :key="user.email">
                            <td><img :src="user.picture.thumbnail" alt="User thumbnail"></td>
                            <td>{{ user.name.first }} {{ user.name.last }}</td>
                            <td>{{ user.gender === 'female' ? '👩' : '👨' }}</td>
                            <td>{{ user.email }}</td>
                            <td>{{ user.phone }}</td>
                            <td>{{ user.dob.age }}</td>
                        </tr>
                    </tbody>
                </table>
            </figure>
        </main>
    </div>
    <script>
    const { createApp, ref, reactive, computed } = Vue;

    createApp({
        setup() {
            const pristineFetchedUsers = ref([]);
            const currentSearchTerm = ref("");
            const currentGenderFilter = ref("");
            const currentSort = reactive({ column: null, direction: null });
            const isLoading = ref(false);
            const fetchError = ref(null);

            const _removeAccents = (str) => {
                return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            };

            const _getValueForSort = (obj, path) => {
                return path.split(".").reduce((o, key) => (o && typeof o === "object" && key in o ? o[key] : undefined), obj);
            };

            const usersToDisplayCountText = computed(() => {
                if (isLoading.value) return "Fetching users...";
                if (fetchError.value) return fetchError.value;
                return `Number of users displayed: ${filteredAndSortedUsers.value.length} of ${pristineFetchedUsers.value.length}`;
            });

            const filteredAndSortedUsers = computed(() => {
                let processedUsers = [...pristineFetchedUsers.value];

                // 1. Apply Search Filter
                if (currentSearchTerm.value) {
                    const normalizedSearch = _removeAccents(currentSearchTerm.value.toLowerCase());
                    if (normalizedSearch) {
                        processedUsers = processedUsers.filter(user => {
                            const fullName = `${user.name.first} ${user.name.last}`;
                            const normalizedFullName = _removeAccents(fullName.toLowerCase());
                            return normalizedFullName.includes(normalizedSearch);
                        });
                    }
                }

                // 2. Apply Gender Filter
                if (currentGenderFilter.value) {
                    processedUsers = processedUsers.filter(user => user.gender === currentGenderFilter.value);
                }

                // 3. Apply Sorting
                if (currentSort.column && currentSort.direction) {
                    processedUsers.sort((a, b) => {
                        let valA = _getValueForSort(a, currentSort.column);
                        let valB = _getValueForSort(b, currentSort.column);

                        if (currentSort.column === "dob.age") {
                            valA = Number(valA);
                            valB = Number(valB);
                        } else if (typeof valA === "string" && typeof valB === "string") {
                            valA = valA.toLowerCase();
                            valB = valB.toLowerCase();
                        } else {
                            if (valA === undefined || valA === null) return currentSort.direction === "asc" ? -1 : 1;
                            if (valB === undefined || valB === null) return currentSort.direction === "asc" ? 1 : -1;
                        }

                        if (valA < valB) return currentSort.direction === "asc" ? -1 : 1;
                        if (valA > valB) return currentSort.direction === "asc" ? 1 : -1;
                        return 0;
                    });
                }
                return processedUsers;
            });

            const fetchUsersMethod = async () => {
                isLoading.value = true;
                fetchError.value = null;
                try {
                    const response = await fetch("https://randomuser.me/api/?results=20");
                    if (!response.ok) {
                        throw new Error(`Network response was not ok: ${response.statusText}`);
                    }
                    const data = await response.json();
                    const fetchedData = data.results;

                    const existingEmails = new Set(pristineFetchedUsers.value.map(u => u.email));
                    const newUsers = fetchedData.filter(u => !existingEmails.has(u.email));

                    if (newUsers.length > 0) {
                        pristineFetchedUsers.value = [...pristineFetchedUsers.value, ...newUsers];
                    } else if (pristineFetchedUsers.value.length === 0 && fetchedData.length > 0) {
                        pristineFetchedUsers.value = [...fetchedData];
                    }

                    // Reset filters and sort
                    currentSearchTerm.value = "";
                    currentGenderFilter.value = "";
                    currentSort.column = null;
                    currentSort.direction = null;

                } catch (error) {
                    console.error("Failed to fetch users:", error);
                    fetchError.value = "Failed to load users. Please try again.";
                } finally {
                    isLoading.value = false;
                }
            };

            const handleSort = (columnToSort) => {
                if (currentSort.column !== columnToSort) {
                    currentSort.column = columnToSort;
                    currentSort.direction = "asc";
                } else if (currentSort.direction === "asc") {
                    currentSort.direction = "desc";
                } else if (currentSort.direction === "desc") {
                    currentSort.column = null;
                    currentSort.direction = null;
                }
            };

            const getColumnHeaderText = (columnKey, baseText) => {
                if (currentSort.column === columnKey && currentSort.direction) {
                    const arrow = currentSort.direction === 'asc' ? ' ↑' : ' ↓';
                    return `${baseText}${arrow}`;
                }
                return baseText;
            };

            const getSortColumnClasses = (columnKey) => {
                const classes = {};
                if (currentSort.column === columnKey && currentSort.direction) {
                    classes[currentSort.direction === 'asc' ? 'sorted-asc' : 'sorted-desc'] = true;
                }
                return classes;
            };

            const getAriaSortDirection = (columnKey) => {
                if (currentSort.column === columnKey && currentSort.direction) {
                    return currentSort.direction === 'asc' ? 'ascending' : 'descending';
                }
                return 'none';
            };

            return {
                pristineFetchedUsers,
                currentSearchTerm,
                currentGenderFilter,
                currentSort,
                isLoading,
                fetchError,
                usersToDisplayCountText,
                filteredAndSortedUsers,
                fetchUsersMethod,
                handleSort,
                getColumnHeaderText,
                getSortColumnClasses,
                getAriaSortDirection
            };
        }
    }).mount('#app');
    </script>
</body>
</html>
