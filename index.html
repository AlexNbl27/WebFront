<!doctype html>
<html lang="en">

<head>
    <title>Vanilla JS Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.fluid.classless.min.css">
</head>

<body>
    <main>
        <div>
            <h1>Vanilla JS Example</h1>
            <hr>
            <div style="display: flex; gap: 0.5rem; align-items: center; vertical-align: middle;">
                <button id="fetch-users" type="button" style="flex: 1; margin: 0px;">Fetch Users</button>
                <div style="display: flex; flex-direction: column; margin: 0px 40px; flex: 1;">
                    <label for="search-users">Search users</label>
                    <form role="search" id="search-users">
                        <input type="text" id="search-users-input"
                            placeholder="Type the name or the first name of the user" aria-label="Search </div>users"
                            autocomplete="off">
                    </form>
                </div>
                <div style="display: flex; flex-direction: column; flex: 1;">
                    <label for="filter-users">Select a user</label>
                    <select id="filter-users" name="filter-users" class="searchw8">
                        <option value="" selected>All</option>
                        <option value="male">👨</option>
                        <option value="female">👩</option>
                    </select>
                </div>
            </div>
        </div>
        <h6 id="users-displayed">Number of users displayed:</h6>
        <table id="tbl-users">
            <thead>
                <tr>
                    <th>Photo</th>
                    <th>Nom</th>
                    <th>Genre</th>
                    <th>Email</th>
                    <th>Tel</th>
                    <th data-sort="dob.age" style="cursor: pointer;">Age</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>
    <script src='index.js'></script>
</body>

</html>
